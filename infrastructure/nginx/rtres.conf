server { listen 80; server_name r3solucionesweb.com www.r3solucionesweb.com; return 301 https://rtres.net/es$request_uri; }
server { listen 80; server_name soluzionipersitiweb.it www.soluzionipersitiweb.it; return 301 https://rtres.net/it$request_uri; }
server { listen 80; server_name rtres.net www.rtres.net; location / { proxy_pass http://web:4000; proxy_set_header Host $host; } location /api/ { proxy_pass http://api:8080/; proxy_set_header Host $host; } }
server { listen 80; server_name portal.rtres.net; location / { proxy_pass http://web:4000/portal/; proxy_set_header Host $host; } location /api/ { proxy_pass http://api:8080/; proxy_set_header Host $host; } }
