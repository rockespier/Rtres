services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "Change-me-2026!" }
    volumes: [sqlserver-data:/var/opt/mssql]
    ports: ["1433:1433"]
  api:
    build: ./src/api/Rtres.Api
    environment: { ConnectionStrings__SqlServer: "Server=sqlserver;Database=rtres;User Id=sa;Password=Change-me-2026!;TrustServerCertificate=True", Jwt__Key: "${JWT_KEY:?Define JWT_KEY en .env (openssl rand -base64 48)}" }
    depends_on: [sqlserver]
  web: { build: ./src/web, depends_on: [api] }
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./infrastructure/nginx/rtres.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]
volumes: { sqlserver-data: {} }
