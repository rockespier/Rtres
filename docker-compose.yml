services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: rtres, POSTGRES_USER: rtres, POSTGRES_PASSWORD: change-me }
    volumes: [postgres-data:/var/lib/postgresql/data]
  api:
    build: ./src/api/Rtres.Api
    environment: { ConnectionStrings__Postgres: Host=postgres;Database=rtres;Username=rtres;Password=change-me }
    depends_on: [postgres]
  web: { build: ./src/web, depends_on: [api] }
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./infrastructure/nginx/rtres.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]
volumes: { postgres-data: {} }
