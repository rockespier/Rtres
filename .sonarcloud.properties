# Exclusiones de SonarCloud (PLAN-sonarqube.md, fase 1). El análisis corre por CI (.github/workflows/build.yml),
# que no lee este archivo: la misma lista va en el paso "begin" del scanner. Mantener ambas iguales.
# Se excluye lo que no es código del producto: tema WordPress de terceros, mockups estáticos,
# scripts SQL de carga de datos, reportes generados y copias de trabajo de la factory.
sonar.exclusions=plantillaElementor/**,mockups/**,infrastructure/sql/**,coveragereport/**,coverage.xml,inspiracion/**,output/**,publish/**,.worktrees/**,**/node_modules/**,**/dist/**
